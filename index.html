<style>
  :root{

  body{margin:0;font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);}

  header p{margin:0;color:#CBD5E0;font-size:13px;}

  nav button{background:none;border:none;color:#EDF2F7;padding:12px 16px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;}
  nav button.active{border-bottom:3px solid var(--accent);font-weight:600;background:rgba(255,255,255,.07);}
  nav button:hover{background:rgba(255,255,255,.08);}
  main{max-width:1000px;margin:0 auto;padding:20px 24px 60px;}
  section{display:none;}
  section.active{display:block;}
  h2{font-size:19px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-top:0;}
  h3{font-size:15px;color:var(--primary);margin:22px 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:14px;}
  .muted{color:var(--secondary);font-size:13px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#EDF2F7;color:var(--secondary);margin-right:6px;}
  .badge-ksb{background:#FFF5F5;color:#C53030;}
  .badge-mod{background:#EBF8FF;color:#2B6CB0;}
  .badge-done{background:var(--greenbg);color:var(--green);}
  .badge-wip{background:var(--amberbg);color:var(--amber);}
  input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-wrap{display:block;overflow-x:auto;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{background:#EDF2F7;color:var(--primary);font-weight:600;}
  .term{font-weight:600;color:var(--primary);}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;text-align:center;flex:1;min-width:120px;cursor:pointer;transition:border-color .15s, transform .1s;}
  .stat:hover{border-color:var(--accent);}
  .stat:active{transform:scale(0.98);}
  .stat .num{font-size:24px;font-weight:700;color:var(--accent);}
  .stat .lab{font-size:12px;color:var(--secondary);}
  .toverify{background:var(--amberbg);border:1px solid #F6E05E;border-radius:8px;padding:14px 18px;margin-bottom:14px;}
  .toverify li{margin-bottom:8px;}
  ul{padding-left:20px;}
  button.btn{background:var(--primary);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;}
  button.btn:hover{background:var(--secondary);}
  .imgwrap{text-align:center;margin:14px 0;}
  .imgwrap img{max-width:100%;border:1px solid var(--border);border-radius:6px;}
  .evidence-layout{display:flex;gap:16px;align-items:flex-start;}
  .evidence-list{flex:0 0 220px;display:flex;flex-direction:column;gap:4px;position:sticky;top:70px;}
  .evidence-item{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:12.5px;cursor:pointer;color:var(--text);line-height:1.4;}
  .evidence-item:hover{border-color:var(--accent);}
  .evidence-item.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}
  .evidence-detail{flex:1;min-width:0;}
  @media (max-width:700px){.evidence-layout{flex-direction:column;} .evidence-list{position:static;flex-direction:row;flex-wrap:wrap;width:100%;}}
  .searchbar{margin-bottom:16px;}
  .small{font-size:12px;color:var(--secondary);}
  .glossary-source{float:right;}
  .term-card{position:relative;padding-right:80px;}
  .term-card.removed{opacity:.45;}
  .term-actions{position:absolute;top:14px;right:14px;display:flex;gap:6px;}
  .icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1;}

  .icon-btn.bin{color:var(--accent);}

  .status-tag{font-size:10px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;}

  .filterbar button.active{background:var(--primary);color:#fff;border-color:var(--primary);}

const GLOSSARY = [
  {id:"rpa", term:"Robotic Process Automation (RPA)", def:"Software that mimics human actions on a computer interface (clicking, copying, pasting) to automate repetitive tasks. It follows fixed rules and cannot handle unexpected variation.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"llm", term:"Large Language Model (LLM)", def:"An AI model trained on enormous amounts of text that can understand and generate human language. It works by predicting the most useful next word or phrase given the context it has been provided.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"hallucination", term:"Hallucination", def:"When a GenAI model generates information that sounds plausible and confident but is factually incorrect. The model does not know it is wrong — it has no way of knowing.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"ai-agent", term:"AI Agent", def:"An AI system that can take sequences of actions to achieve a goal, using tools (search, code execution, API calls) and making intermediate decisions. It operates with more autonomy than a single-turn GenAI model.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"hitl", term:"Human-in-the-loop (HITL)", def:"A design principle / supervision model in which human review, approval, or correction is built into an AI-enabled process at defined points. The AI proposes; the human decides before anything downstream happens. Most intensive form of oversight — costs throughput but is appropriate where errors carry significant consequence.", src:"Module 1, Unit 1 · Module 2, Unit 1 / My own glossary"},
  {id:"hotl", term:"Human-on-the-loop", def:"A supervision model where the AI acts autonomously, but a human monitors outputs and can intervene to override or correct them. More efficient than human-in-the-loop, but only real oversight if the monitor genuinely has time, clear signals, and authority to act.", src:"Module 2, Unit 1"},
  {id:"hootl", term:"Human-out-of-the-loop", def:"The AI acts fully autonomously with no live human involvement. Appropriate for low-stakes, high-volume, easily reversible actions; inappropriate where actions are irreversible or errors are consequential.", src:"Module 2, Unit 1"},
  {id:"auto-bias", term:"Automation bias", def:"The tendency for people to over-rely on automated systems, accepting their outputs without applying the judgement or verification they would apply to the same information from a human source.", src:"Module 2, Unit 1"},
  {id:"fine-tuning", term:"Fine-tuning", def:"Taking a general LLM and training it further on a specific dataset (e.g. a company's internal documents) so it performs better on that domain or style. More resource-intensive than standard deployment, but can significantly improve relevance and accuracy for specialist use cases.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"embeddings", term:"Embeddings", def:"A way of representing meaning numerically so that similar concepts can be found mathematically. Foundational to search and retrieval systems that connect GenAI to specific knowledge bases.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"rag", term:"Retrieval-Augmented Generation (RAG)", def:"A technique where a GenAI model is connected to a knowledge base and retrieves relevant documents at the moment of a query, using them to generate a more accurate, grounded response. Widely used in enterprise AI as a way of reducing hallucination risk.", src:"Module 1, Unit 1 / My own glossary"},
  {id:"sentiment", term:"Sentiment analysis", def:"The process of reading a piece of text and determining the emotional tone behind it — typically classifying it as positive or negative. One of the most established business applications of AI: the model reads comments at scale and returns a structured judgement on each.", src:"My own glossary"},
  {id:"ai-builder", term:"AI Builder", def:"Microsoft's no-code AI capability built into the Power Platform. Lets you use AI models — including LLMs — directly inside Power Automate flows without writing code. The \"Run a prompt\" action sends text to an AI model and returns a generated response. Runs on Copilot credits — check licensing before building.", src:"Module 1, Unit 2 / My own glossary"},
  {id:"vsm", term:"Value Stream Mapping (VSM)", def:"Originated in lean manufacturing (Toyota Production System). Where a process map asks \"what happens and who does it?\", VSM asks a broader question: across the entire end-to-end flow, where is value created, and where is time/effort consumed without adding value? More strategic than process mapping — used to prioritise where to focus, not to design a specific automation. For apprenticeship project work, process mapping is the right tool; VSM is out of scope but useful context.", src:"Module 1, Unit 3 / My own glossary"},
  {id:"centaur", term:"Centaur mode", def:"A human-AI collaboration pattern (term coined by Garry Kasparov, later adopted by Harvard Business School researchers) named after the mythological half-human, half-horse. Humans and AI each own distinct subtasks with a clear division of labour — the human directs and takes the judgement steps, the AI handles the defined portion assigned to it. In retrospect it's clear which part was done by whom. Works well when you already have a reasonable, tested sense of what the AI can do reliably, so you can hand off and trust the output without much back-and-forth. Typical tasks: human writes, AI translates; human drafts, AI edits/summarises; AI outlines, human fills in judgement.", src:"Module 2, Unit 1"},
  {id:"cyborg", term:"Cyborg mode", def:"The counterpart to centaur mode: human and AI work in continuous, iterative back-and-forth rather than taking turns at discrete tasks. The human is always involved, the AI always active — the interaction moves back and forth across the 'jagged frontier' of AI capability, and afterwards it's often hard to say which part the human wrote and which the AI produced. Typical tasks: collaborative creative writing, iteratively developing a problem statement, tailoring a complex document like interview questions through repeated prompting. Neither centaur nor cyborg is inherently better — the right pattern depends on the step, not the person.", src:"Module 2, Unit 1"},
  {id:"jagged-frontier", term:"The jagged frontier", def:"The uneven, unpredictable boundary between what AI does reliably and where human judgement is still essential — it doesn't run neatly along task type or difficulty the way you'd expect, which is exactly why cyborg-style continuous collaboration (rather than a one-off handoff) is often needed to navigate it. Introduced alongside the centaur/cyborg distinction.", src:"Module 2, Unit 1"},
  {id:"readiness-test", term:"The readiness test", def:"A quick practical check for whether a task is likely automatable: could you describe it to a new colleague, step by step, precisely enough that they'd produce the same output without relying on experience or instinct they haven't built yet? If yes, the task probably has an automatable core. Answers like \"it depends\" or \"you just know when you've seen enough of them\" signal complexity that needs resolving first. It only tells you automation is possible in principle — not whether it's the right choice (that's what the five-dimension Suitability Framework is for).", src:"Module 1, Unit 3"},
  {id:"broken-process", term:"Do not automate a broken process", def:"A core practitioner warning: automation amplifies whatever it automates. A well-designed process, automated, becomes faster and more consistent; a poorly designed one produces the same errors at greater speed and scale. Process improvement — removing waste, fixing data quality, eliminating unnecessary steps — often needs to happen before automation, not after.", src:"Module 1, Unit 3"},
  {id:"effort-value", term:"The Effort/Value matrix", def:"A comparison tool for when you have more than one strong candidate process. Plots candidates on two axes — value created (direct + indirect, scored High/Medium/Low) against effort to implement (technical complexity, data readiness, organisational friction). High-value/low-effort = priority. High-value/high-effort = worth pursuing but needs more groundwork. Low-value/low-effort = not a priority project. Low-value/high-effort = set aside.", src:"Module 1, Unit 4"},
  {id:"direct-indirect-value", term:"Direct vs indirect value", def:"Two forms of productivity value from automation. Direct value is measurable and immediate — hours saved, cost of errors avoided, transaction volume, headcount capacity released — and is what you lead with in a business case because it's easiest to verify. Indirect value is real but harder to quantify — customer experience, reduced staff frustration, data quality improvements, strategic positioning. Senior leaders often weight both; a strong business case is honest about which figures are precise and which are directional.", src:"Module 1, Unit 4"},
  {id:"scoping-discipline", term:"Scoping discipline", def:"Described as the single most common way apprenticeship projects fail — not from lack of capability, but from choosing a scope too large to deliver in the programme timeline. The test for good scoping: is the opportunity specific, bounded, achievable within six to eight weeks of active build time, visible to the organisation, and supported by your line manager? A small, completed automation teaches and demonstrates more than a large, unfinished one.", src:"Module 1, Unit 4"},
  {id:"five-component-case", term:"The five-component business case", def:"The required structure for the apprenticeship gateway submission (approx. 600–900 words): (1) Process description, (2) The opportunity, (3) Productivity value assessment, (4) Feasibility check, (5) Next steps. Submitted together with the Unit 3 workflow map and suitability scoring as supporting evidence.", src:"Module 1, Unit 4"},
  {id:"personal-data", term:"Personal data", def:"Any information relating to an identified or identifiable living person. Identifiability is the key test: if someone could be identified from the data either alone or in combination with other information you hold, it is personal data.", src:"Module 2, Unit 2"},
  {id:"automated-decision-making", term:"Automated decision-making (Article 22A)", def:"A decision made solely by automated means, without meaningful human involvement, that produces a legal effect or a similarly significant effect on an individual (e.g. automated credit scoring, CV screening, automated redundancy selection). Since February 2026 this is not banned outright in the UK — it's permitted on an ordinary lawful basis, subject to the Article 22C safeguards.", src:"Module 2, Unit 2"},
  {id:"special-category-data", term:"Special category data", def:"Eight protected categories under UK GDPR (Article 9) — health, racial/ethnic origin, religious/philosophical belief, political opinion, trade union membership, genetic data, biometric data used for ID, and sex life/sexual orientation — that require a specific, narrow lawful condition beyond an ordinary basis. High risk in tools that process unstructured free text, since these can surface incidentally rather than by design.", src:"Module 2, Unit 2 / My own glossary"},
  {id:"lia", term:"Legitimate Interests Assessment (LIA)", def:"A formal, documented balancing test required before relying on \"legitimate interests\" as a lawful basis — weighing the organisation's interest against the impact on the individuals affected. An assertion in a business case is not a substitute for actually completing this assessment.", src:"Module 2, Unit 2 / My own glossary"},
  {id:"dpia", term:"Data Protection Impact Assessment (DPIA)", def:"A formal governance review required under Article 35 UK GDPR when processing is likely to result in high risk to individuals — a fairly classic trigger being the combination of free-text personal data, AI/automated processing, and a third-party processor.", src:"Module 2, Unit 2 / My own glossary"},
  {id:"proxy-bias", term:"Proxy bias", def:"Where an AI system doesn't capture a protected characteristic directly, but a feature that correlates with one (speech pattern, name format, activity level) ends up producing a disadvantageous outcome for people with that characteristic anyway. \"Not direct\" doesn't mean \"not at all\" — proxy pathways need to be mapped feature by feature, not waved away.", src:"Module 2, Unit 2 / My own glossary"},
  {id:"pseudo-oversight", term:"Pseudo-oversight", def:"A human review step that is formally present in a workflow but practically ineffective, because the reviewer lacks the information, time, authority, or cognitive bandwidth to exercise genuine judgement. The opposite of what the four-question oversight framework is designed to test for.", src:"Module 2, Unit 3"},
  {id:"explainability", term:"Explainability", def:"The extent to which the basis for an AI system's output can be understood by the people responsible for reviewing or acting on it. A design property of the system, not just a communication task performed after the fact.", src:"Module 2, Unit 3"},
  {id:"risk-appetite", term:"Risk appetite", def:"The level of risk an organisation is willing to accept in pursuit of its objectives. In AI terms: how much uncertainty about a system's outputs is tolerated, how quickly it's willing to deploy before testing is complete, and how it balances innovation speed against the risk of harm.", src:"Module 2, Unit 3"},
  {id:"ai-champion", term:"AI champion", def:"A practitioner who helps their organisation adopt AI responsibly by providing evidence-based analysis of both opportunities and risks, translating technical realities into terms non-technical leaders can act on, and advocating for responsible design as the foundation for sustainable value.", src:"Module 2, Unit 3"},
  {id:"deepfake", term:"Deepfake", def:"A synthetic audio or video generated using AI, typically by training a model on existing recordings of a real person. Quality has increased significantly as the tools required to create them have become widely accessible.", src:"Module 2, Unit 4"},
  {id:"spear-phishing", term:"Spear phishing", def:"A targeted phishing attack directed at a specific individual or organisation, using personalised details to increase believability — distinguished from generic phishing by its specificity. AI has dramatically reduced the cost and time required to produce spear phishing at scale.", src:"Module 2, Unit 4"},
  {id:"prompt-injection", term:"Prompt injection", def:"An attack in which a user provides input designed to override or subvert an AI system's existing instructions, causing it to behave in ways its designers did not intend. Distinct from jailbreaking (which targets the base model) in that it exploits the specific configuration and system prompt of a deployed application.", src:"Module 2, Unit 4"},
  {id:"least-privilege", term:"Least-privilege access", def:"The principle that any system, user, or agent should be granted only the minimum access rights necessary to perform its intended function. A standard information-security principle applied specifically to AI agent design — Principle 1 of the six safe agent adoption principles.", src:"Module 2, Unit 4"},
  {id:"stakeholder-impact", term:"Stakeholder impact", def:"The totality of effects, intended and unintended, that an AI deployment has on the people directly and indirectly involved — including job role changes, skill requirements, workload shifts, psychological impact, and changes to professional identity.", src:"Module 2, Unit 4"},
];

    body:"<b>1. Least-privilege access</b> — grant only the minimum access needed for the task, documented as a positive list of what's allowed rather than a negative list of what isn't.<br><b>2. Scope boundaries</b> — \"can do\" and \"is allowed to do\" are different questions; enforce architecturally (RBAC, read-only credentials, rate limits) not just in the system prompt.<br><b>3. Human approval gates for consequential actions</b> — anything not easily reversible needs a checkpoint before it happens.<br><b>4. Prompt injection awareness</b> — treat any user-supplied content the AI processes as potentially adversarial input, not just data.<br><b>5. Transparency with users</b> — people interacting with or affected by the agent should be able to tell AI was involved.<br><b>6. Failure modes and escalation paths</b> — define what happens when the agent gets it wrong or hits a case it can't handle, before it happens in production, not after."

  const totalUnits=MODULES.flatMap(m=>m.units).length;
  return `
  <h2>Overview</h2>
  <div class="card">
    <p><b>Programme:</b> Level 4 AI &amp; Automation Practitioner (AI Transformation Specialist route)<br>
    <b>Provider:</b> AiCore<br>
    <b>Learner:</b> Maria Dolores Olaya Santiago (Loles)<br>
    <b>Employer:</b> RWS Group<br>
    <b>Cohort / start date:</b> 21/05/2026</p>
  </div>
  <div class="flex">
    <div class="stat" onclick="showTab('modules')" title="Go to Modules &amp; units"><div class="num">${doneUnits}/${totalUnits}</div><div class="lab">Units marked complete</div></div>
    <div class="stat" onclick="showTab('otj')" title="Go to OTJ hours log"><div class="num">${totalOtj}</div><div class="lab">OTJ hours logged (of 420)</div></div>
    <div class="stat" onclick="showTab('glossary')" title="Go to Glossary"><div class="num">${GLOSSARY.length+FRAMEWORKS.length}</div><div class="lab">Glossary &amp; framework entries</div></div>
    <div class="stat" onclick="showTab('ksb')" title="Go to KSB map"><div class="num">${KSB_MAP.length}</div><div class="lab">KSB codes tracked</div></div>
  </div>
  <div class="toverify">
    <b>Last updated:</b> ${LAST_UPDATE} — see <b>Sources &amp; updates</b> tab for exactly which files fed this build, and <b>To verify</b> for open questions to check with you.
  </div>`;
}

/* ---- Modules ---- */
function renderModules(){
  let h=`<h2>Modules &amp; units</h2>`;
  MODULES.forEach(m=>{
    h+=`<div class="card"><h3 style="margin-top:0">${m.mod} <span class="badge ${m.status==='done'?'badge-done':'badge-wip'}">${m.status==='done'?'complete':'in progress'}</span></h3>`;
    m.units.forEach(u=>{
      h+=`<div style="margin:12px 0;padding:10px 12px;background:${u.status==='done'?'var(--greenbg)':'var(--amberbg)'};border-radius:6px;">
        <div class="flex" style="justify-content:space-between;">
          <b>${u.name}</b>
          <span class="badge ${u.status==='done'?'badge-done':'badge-wip'}">${u.status==='done'?'complete':'WIP'}</span>
        </div>
        <ul>${u.activities.map(a=>`<li class="small">${a}</li>`).join('')}</ul>
        <div>${u.ksbs.map(k=>`<span class="badge badge-ksb">${k}</span>`).join('')}</div>
      </div>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* ---- Glossary ---- */
let glossaryFilter='all';
function renderGlossary(){
  return `
  <h2>Glossary</h2>
  <p class="muted">Extracted from every key-term box, named concept and framework across the uploaded modules and workbooks. Terms you've already reviewed are marked confirmed or flagged for removal and won't show the tick/bin icons again — only new, undecided terms need a decision. Click "change" on any settled term to revisit it. <button class="btn" style="float:right;" onclick="exportDecisions()">Export my decisions</button></p>
  <div class="searchbar"><input type="text" id="glossarySearch" placeholder="Search terms..." oninput="filterGlossary()"></div>
  <div class="filterbar" id="glossaryFilterbar"></div>
  <div id="glossaryList"></div>`;
}
function setGlossaryFilter(f){glossaryFilter=f;filterGlossary();}
function filterGlossary(){
  const fb=document.getElementById('glossaryFilterbar');
  if(fb){
    const opts=[['all','All'],['undecided','Undecided'],['confirmed','Confirmed'],['removed','Marked for removal']];
    fb.innerHTML=opts.map(([id,label])=>`<button class="${glossaryFilter===id?'active':''}" onclick="setGlossaryFilter('${id}')">${label}</button>`).join('');
  }
  const q=(document.getElementById('glossarySearch').value||'').toLowerCase();
  const list=document.getElementById('glossaryList');
  let items=GLOSSARY.filter(g=>g.term.toLowerCase().includes(q)||g.def.toLowerCase().includes(q));
  if(glossaryFilter!=='all'){
    items=items.filter(g=>{
      const d=state.termDecisions[g.id];
      if(glossaryFilter==='undecided') return !d;
      return d===glossaryFilter;
    });
  }
  list.innerHTML=items.map(g=>{
    const d=state.termDecisions[g.id];
    const decided=!!d;
    return `
    <div class="card term-card ${d==='removed'?'removed':''}">
      <div class="term-actions">
        ${decided
          ? `<span class="status-tag ${d}">${d==='confirmed'?'confirmed':'flagged for removal'}</span> <a href="#" class="small" onclick="event.preventDefault();clearTermDecision('${g.id}')" style="margin-left:6px;">change</a>`
          : `<button class="icon-btn tick" title="Confirm — keep this term" onclick="setTermDecision('${g.id}','confirmed')">&#10003;</button>
             <button class="icon-btn bin" title="Mark for removal" onclick="setTermDecision('${g.id}','removed')">&#128465;</button>`
        }
      </div>
      <span class="badge glossary-source">${g.src}</span>
      <div class="term">${g.term}</div>
      <div class="small" style="margin-top:4px;line-height:1.5;">${g.def}</div>
    </div>`;
  }).join('') || '<p class="muted">No matches.</p>';
}
function setTermDecision(id,decision){
  state.termDecisions[id]=decision;
  save();
  filterGlossary();
}
function clearTermDecision(id){
  delete state.termDecisions[id];
  save();
  filterGlossary();
}
function exportDecisions(){
  const confirmed=GLOSSARY.filter(g=>state.termDecisions[g.id]==='confirmed').map(g=>g.term);
  const removed=GLOSSARY.filter(g=>state.termDecisions[g.id]==='removed').map(g=>g.term);
  const undecided=GLOSSARY.filter(g=>!state.termDecisions[g.id]).map(g=>g.term);
  const text=`AI Apprenticeship Tracker — glossary decisions (${new Date().toISOString().slice(0,10)})\n\nCONFIRMED (${confirmed.length}):\n${confirmed.map(t=>'- '+t).join('\n')}\n\nMARKED FOR REMOVAL (${removed.length}):\n${removed.map(t=>'- '+t).join('\n')}\n\nUNDECIDED (${undecided.length}):\n${undecided.map(t=>'- '+t).join('\n')}\n`;
  const blob=new Blob([text],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='glossary-decisions.txt';
  a.click();
}

/* ---- Frameworks ---- */
function renderFrameworks(){
  return `<h2>Frameworks &amp; models</h2>
  <p class="muted">Multi-part frameworks referenced across the modules — kept separate from single-term glossary entries.</p>
  ${FRAMEWORKS.map(f=>`
    <div class="card">
      <span class="badge glossary-source">${f.module}</span>
      <div class="term">${f.title}</div>
      <div class="small" style="margin-top:6px;line-height:1.6;">${f.body}</div>
    </div>`).join('')}`;
}

/* ---- KSB map ---- */
function renderKsb(){
  return `<h2>KSB evidence map</h2>
  <p class="muted">Compiled from KSB Relevance boxes across all uploaded workbooks and the KSB_List.xlsx extract. This is a working map, not the official standard — see <b>To verify</b>.</p>
  <div class="table-wrap"><table>
    <tr><th>Code</th><th>Description</th><th>Where it appears</th></tr>
    ${KSB_MAP.map(k=>`<tr><td><span class="badge badge-ksb">${k.code}</span></td><td>${k.desc}</td><td class="small">${k.where}</td></tr>`).join('')}
  </table></div>`;
}

/* ---- OTJ ---- */
function allOtj(){
  return [...SEED_OTJ, ...state.customOtj].slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function renderOtj(){
  const entries=allOtj();
  const total=entries.reduce((s,e)=>s+(parseFloat(e.hours)||0),0);
  return `<h2>Off-the-job (OTJ) hours log</h2>
  <p class="muted">Target: 420 hours. The 57 seeded entries below always come straight from the latest OTJs_Tracker.xlsx upload — they can't go stale in your browser. Anything you add yourself below is saved locally on top of them.</p>
  <div class="stat" style="max-width:200px;margin-bottom:14px;cursor:default;"><div class="num">${total}</div><div class="lab">hours logged</div></div>
  <div class="table-wrap"><table>
    <tr><th>Date</th><th>Description</th><th>Hours</th><th>Type</th></tr>
    ${entries.map(e=>`<tr><td style="white-space:nowrap;">${e.date}</td><td>${e.desc}</td><td>${e.hours}</td><td><span class="badge">${e.type||''}</span></td></tr>`).join('')}
  </table></div>
  <h3>Add an entry</h3>
  <div class="card">
    <div class="flex">
      <input type="text" id="otjDate" placeholder="YYYY-MM-DD" style="max-width:140px;">
      <input type="text" id="otjHours" placeholder="Hours" style="max-width:80px;">
      <input type="text" id="otjType" placeholder="Activity type" style="max-width:180px;">
    </div>
    <textarea id="otjDesc" placeholder="Description" style="margin-top:8px;" rows="2"></textarea>
    <button class="btn" style="margin-top:8px;" onclick="addOtj()">Add entry</button>
  </div>`;
}
function addOtj(){
  const date=document.getElementById('otjDate').value.trim();
  const hours=parseFloat(document.getElementById('otjHours').value);
  const desc=document.getElementById('otjDesc').value.trim();
  const type=document.getElementById('otjType').value.trim();
  if(!date||!desc||!hours){alert('Please fill in date, description and hours.');return;}
  state.customOtj.push({date,desc,hours,type});
  save();
  renderAll();
  showTab('otj');
}

/* ---- Evidence ---- */
let evidenceIndex=0;
function renderEvidence(){
  return `<h2>Portfolio evidence</h2>
  <p class="muted">Select an item to view it.</p>
  <div class="evidence-layout">
    <div class="evidence-list" id="evidenceList"></div>
    <div class="evidence-detail" id="evidenceDetail"></div>
  </div>`;
}
function selectEvidence(i){
  evidenceIndex=i;
  renderEvidenceList();
  renderEvidenceDetail();
}
function renderEvidenceList(){
  const list=document.getElementById('evidenceList');
  if(!list)return;
  list.innerHTML=PORTFOLIO_EVIDENCE.map((e,i)=>`
    <button class="evidence-item ${i===evidenceIndex?'active':''}" onclick="selectEvidence(${i})">${e.title}</button>
  `).join('');
}
function renderEvidenceDetail(){
  const el=document.getElementById('evidenceDetail');
  if(!el)return;
  const e=PORTFOLIO_EVIDENCE[evidenceIndex];
  el.innerHTML=`
    <div class="card">
      <div class="term">${e.title}</div>
      <p class="small" style="line-height:1.6;margin-top:8px;">${e.desc}</p>
      ${e.img?'<div class="imgwrap"><img src="patorg_enhancement_swimlane.png" alt="PatOrg enhancement swimlane"></div>':''}
    </div>`;
}

/* ---- Notes ---- */
function renderNotes(){
  return `<h2>My notes &amp; prompts</h2>
  <h3>Prompt library (from My_own_glossary.xlsx)</h3>
  <div class="table-wrap"><table>
    <tr><th>Purpose</th><th>Prompt</th></tr>
    ${PROMPTS.map(p=>`<tr><td>${p.purpose}</td><td class="small">${p.prompt}</td></tr>`).join('')}
  </table></div>
  <h3>Free notes</h3>
  <div class="card">
    <textarea id="freeNotes" rows="6" placeholder="Anything else worth keeping here...">${state.notes||''}</textarea>
    <button class="btn" style="margin-top:8px;" onclick="saveNotes()">Save notes</button>
  </div>
  <p class="muted">Workbook activity answers (your own draft input/feedback in each unit workbook) were kept out of this tracker deliberately — they're working answers, not confirmed evidence text. Say the word if you'd like a dedicated "draft answers" section added per unit.</p>`;
}
function saveNotes(){
  state.notes=document.getElementById('freeNotes').value;
  save();
}

/* ---- Verify ---- */
function renderVerify(){
  return `<h2>To verify with you</h2>
  <div class="toverify"><ul>${TOVERIFY.map(v=>`<li>${v}</li>`).join('')}</ul></div>`;
}

/* ---- Sources ---- */
function renderSources(){
  return `<h2>Sources &amp; update log</h2>
  <p class="muted">Every time new material is uploaded and folded in, add a row here with the date — this is how you'll know what's been included and what still needs a top-up.</p>
  <div class="table-wrap"><table>
    <tr><th>File</th><th>What it contributed</th><th>Date included</th></tr>
    ${SOURCES.map(s=>`<tr><td>${s.file}</td><td class="small">${s.note}</td><td>${s.date}</td></tr>`).join('')}
  </table></div>
  <p class="small" style="margin-top:10px;"><b>Last full update:</b> ${LAST_UPDATE}</p>`;
}

function renderAll(){
  main.innerHTML='';
  const sections={
    overview:renderOverview, modules:renderModules, glossary:renderGlossary,
    frameworks:renderFrameworks, ksb:renderKsb, otj:renderOtj,
    evidence:renderEvidence, notes:renderNotes, verify:renderVerify, sources:renderSources
  };
  TABS.forEach(t=>{
    const s=document.createElement('section');
    s.id=t.id;
    s.innerHTML=sections[t.id]();
    main.appendChild(s);
  });
  filterGlossary();
  renderEvidenceList();
  renderEvidenceDetail();
  showTab('overview');
}
renderAll();
</script>
</body>
</html>
